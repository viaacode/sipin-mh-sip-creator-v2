[project]
name = "sipin-mh-sip-creator-v2"
version = "0.2.4"
description = "Service that creates a Mediahaven SIP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "viaa-chassis==0.2.1",
    "pulsar-client==3.7.0",
    "meemoo-cloudevents==v0.1.0-rc.3",
    "SIP.py==0.1.0",
    "requests==2.32.4",
    "jinja2==3.1.6",
    "pydantic==2.11.7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.10",
    "pytest==8.4.0",
    "pytest-cov==6.1.1",
    "testcontainers==4.10.0",
]

[dependency-groups]
# uv installs this group by default. The transformator is not published, so it
# comes from the pinned submodule; pip users install it by hand.
dev = [
    "sipin-mh-sip-creator-v2[dev]",
    "sipin-meemoo-sip-2-transformator",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
allow-insecure-host = ["do-prd-mvn-01.do.viaa.be"]

[tool.uv.sources]
sipin-meemoo-sip-2-transformator = { path = "tests/transformator", editable = true }

[[tool.uv.index]]
name = "meemoo"
url = "http://do-prd-mvn-01.do.viaa.be:8081/repository/pypi-all/simple"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-v --ignore=tests/transformator"
pythonpath = ["src"]

[[tool.mypy.overrides]]
module = ["untyped_package.*"]
follow_untyped_imports = true

[tool.setuptools.package-data]
"app" = ["**/*"]
